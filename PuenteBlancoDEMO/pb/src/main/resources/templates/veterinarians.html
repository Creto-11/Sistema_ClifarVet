<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8" />
    <title>CLIFARVET | Nuestros Veterinarios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        clifarBase: '#1C8C7A',
                        clifarDark: '#0F5E52',
                        clifarAccent: '#F6B44B',
                        clifarBg: '#F2F4F3',
                        textMain: '#1F2933',
                        textSec: '#6B7280',
                    }
                }
            }
        }
    </script>

    <style>
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fade-in-up 0.6s ease-out both; }
    </style>
</head>

<body class="bg-clifarBg font-sans antialiased text-textMain min-h-screen">

    <header class="h-16 bg-clifarDark text-white px-4 md:px-6 flex justify-between items-center w-full fixed top-0 z-30 shadow-md">
        <div class="flex items-center gap-3">
            <button onclick="toggleSidebar()" class="md:hidden text-white focus:outline-none hover:bg-white/10 p-1 rounded-md transition">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>

            <div class="flex items-center gap-2">
                <i class="fa-solid fa-paw text-2xl text-clifarAccent"></i>
                <h1 class="text-xl font-bold tracking-tight">CLIFARVET <span class="font-light hidden sm:inline">|
                        Puente Blanco</span></h1>
            </div>
        </div>
    </header>

    <div class="flex w-full pt-16">
        <aside id="sidebar" class="fixed top-16 left-0 w-64 h-[calc(100vh-64px)] bg-[#111827] text-gray-300 flex flex-col justify-between z-40
              transform md:translate-x-0 -translate-x-full transition-transform duration-300 ease-in-out">
            
            <div class="py-6 flex flex-col px-3 space-y-2">
                <p class="text-[11px] uppercase tracking-widest text-gray-500 font-extrabold px-3 mb-3">Menú Principal</p>
                
                <a th:href="@{/dashboard}" class="flex items-center gap-3 p-3 rounded-lg hover:bg-white/10 transition-all">
                    <i class="fa-solid fa-table-columns w-5 text-center text-xl"></i>
                    <span class="font-medium">Dashboard</span>
                </a>

                <a th:href="@{/book-appointment}" class="sidebar-link flex items-center gap-3 p-3 rounded-lg hover:bg-white/10 hover:text-white transition-all">
                    <i class="fa-solid fa-calendar-plus w-5 text-center text-xl"></i>
                    <span class="font-medium">Agendar Cita</span>
                </a>
                <a th:href="@{/appointments}" class="flex items-center gap-3 p-3 rounded-lg hover:bg-white/10 transition-all">
                    <i class="fa-solid fa-clock w-5 text-center text-xl"></i>
                    <span class="font-medium">Ver Citas</span>
                </a>

                <a th:href="@{/book-appointment}" class="flex items-center gap-3 p-3 rounded-lg text-clifarAccent bg-clifarBase/30 border-l-4 border-clifarAccent transition-all shadow-inner">
                    <i class="fa-solid fa-user-doctor w-5 text-center text-xl"></i>
                    <span class="font-medium">Veterinarios</span>
                </a>
            </div>

            <div class="p-4 border-t border-gray-700/50">
                <button onclick="logout()" class="w-full flex items-center justify-center gap-2.5 bg-gray-700/60 text-red-400 hover:bg-red-500 hover:text-white px-4 py-3 rounded-xl transition-all duration-200">
                    <i class="fa-solid fa-power-off text-lg"></i> 
                    <span class="font-semibold">Cerrar Sesión</span>
                </button>
            </div>
        </aside>

        <main class="flex-1 p-4 md:p-8 ml-0 md:ml-64 transition-all duration-300">
            <div class="max-w-6xl mx-auto">
                <div class="text-center mb-12 animate-fade-in-up">
                    <h2 class="text-4xl font-black text-clifarDark tracking-tight">Nuestros Especialistas</h2>
                    <div class="w-20 h-1.5 bg-clifarAccent mx-auto mt-4 rounded-full"></div>
                    <p class="text-textSec mt-4 font-medium max-w-lg mx-auto">Conoce al equipo de profesionales dedicados a la salud y bienestar de tus mascotas.</p>
                </div>

                <div id="veterinariosContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                    </div>
            </div>
        </main>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        // Cargar Veterinarios
        fetch("/api/client/veterinarians", { credentials: "include" })
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById("veterinariosContainer");
                data.forEach((vet, index) => {
                    const card = document.createElement("div");
                    // Retraso escalonado para la animación
                    card.style.animationDelay = `${index * 0.1}s`;
                    card.className = "bg-white rounded-[2rem] shadow-xl border border-gray-100 p-8 flex flex-col items-center text-center animate-fade-in-up hover:scale-[1.03] transition-all duration-300 group";

                    card.innerHTML = `
                        <div class="relative mb-6">
                            <div class="absolute inset-0 bg-clifarAccent rounded-full blur-lg opacity-20 group-hover:opacity-40 transition-opacity"></div>
                            <img src="img/vetgato.jpg" alt="Veterinario" class="relative w-32 h-32 object-cover rounded-full border-4 border-white shadow-lg" />
                        </div>
                        <h3 class="text-xl font-black text-clifarDark mb-1">Dr. ${vet.nombreCompleto}</h3>
                        <span class="inline-block bg-clifarBase/10 text-clifarBase px-4 py-1.5 text-[10px] font-black uppercase tracking-widest rounded-full mb-4 border border-clifarBase/20">
                            ${vet.especialidad}
                        </span>
                        <p class="text-sm text-textSec font-medium leading-relaxed">
                            Comprometido con la excelencia médica y el trato humano para el cuidado integral de cada paciente.
                        </p>
                        <div class="mt-6 flex gap-3">
                            <div class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center text-clifarBase hover:bg-clifarBase hover:text-white transition-colors cursor-pointer border border-gray-100">
                                <i class="fa-solid fa-envelope"></i>
                            </div>
                            <div class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center text-clifarBase hover:bg-clifarBase hover:text-white transition-colors cursor-pointer border border-gray-100">
                                <i class="fa-solid fa-calendar-plus"></i>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });

        function logout() {
            document.cookie = "jwt=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC;";
            window.location.href = "/";
        }
    </script>
<div th:replace="~{fragments/asistente :: ia-asistente(modo='privado')}"></div>
</body>
</html>
