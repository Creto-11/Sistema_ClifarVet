<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>CLIFARVET | Registro de Mascota</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        clifarBase: '#1C8C7A',    
                        clifarDark: '#0F5E52',    
                        clifarLight: '#6FC3B2',   
                        clifarCTA: '#F26A4B',     
                        clifarAccent: '#F6B44B',  
                        clifarBg: '#F2F4F3',      
                        textMain: '#1F2933',      
                        textSec: '#6B7280',       
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-clifarBg font-sans antialiased text-textMain min-h-screen">

    <header class="h-16 bg-clifarDark text-white px-6 flex justify-between items-center w-full fixed top-0 z-30 shadow-md">
        <div class="flex items-center gap-4">
            <button onclick="toggleSidebar()" class="md:hidden text-white focus:outline-none p-1">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-paw text-2xl text-clifarAccent"></i>
                <h1 class="text-xl font-bold tracking-tight">CLIFARVET <span class="font-light hidden sm:inline">| Puente Blanco</span></h1>
            </div>
        </div>
        <div class="flex items-center gap-2 md:gap-3">
            <span th:text="'Hola, ' + ${dashboard.fullName}" class="text-sm font-medium opacity-90 truncate max-w-[150px] md:max-w-[250px]">Shamira Shantal</span>
            <div class="w-9 h-9 bg-white/20 rounded-full flex items-center justify-center border border-white/20">
                <i class="fa-solid fa-user text-sm text-white/90"></i>
            </div>
        </div>
    </header>

    <div class="flex w-full pt-16">
        <aside id="sidebar" class="fixed top-16 left-0 w-64 h-[calc(100vh-64px)] bg-[#111827] text-gray-300 flex flex-col justify-between z-40
              transform md:translate-x-0 -translate-x-full transition-transform duration-300 ease-in-out shadow-2xl md:shadow-none">
            
            <div class="py-6 flex flex-col px-3 space-y-2">
                <p class="text-[11px] uppercase tracking-widest text-gray-500 font-extrabold px-3 mb-3">Menú Principal</p>
                
                <a th:href="@{/dashboard}" class="flex items-center gap-3 p-3 rounded-lg text-clifarAccent bg-clifarBase/30 border-l-4 border-clifarAccent transition-all shadow-inner">
                    <i class="fa-solid fa-table-columns w-5 text-center text-xl"></i>
                    <span class="font-bold">Dashboard</span>
                </a>

                <a th:href="@{/book-appointment}" class="sidebar-link flex items-center gap-3 p-3 rounded-lg hover:bg-white/10 hover:text-white transition-all">
                    <i class="fa-solid fa-calendar-plus w-5 text-center text-xl"></i>
                    <span class="font-medium">Agendar Cita</span>
                </a>

                <a th:href="@{/appointments}" class="sidebar-link flex items-center gap-3 p-3 rounded-lg hover:bg-white/10 hover:text-white transition-all">
                    <i class="fa-solid fa-clock w-5 text-center text-xl"></i>
                    <span class="font-medium">Ver Citas</span>
                </a>

                <a th:href="@{/veterinarians}" class="sidebar-link flex items-center gap-3 p-3 rounded-lg hover:bg-white/10 hover:text-white transition-all">
                    <i class="fa-solid fa-user-doctor w-5 text-center text-xl"></i>
                    <span class="font-medium">Veterinarios</span>
                </a>
            </div>

            <div class="p-4 border-t border-gray-700/50">
                <button onclick="logout()" class="w-full flex items-center justify-center gap-2.5 bg-gray-700/60 text-red-400 hover:bg-red-500 hover:text-white px-4 py-3 rounded-xl transition-all duration-200">
                    <i class="fa-solid fa-power-off text-lg"></i> 
                    <span class="font-semibold">Cerrar Sesión</span>
                </button>
            </div>
        </aside>

        <main class="flex-1 p-4 md:p-8 ml-0 md:ml-64 transition-all duration-300">
            
            <div class="mb-8 p-6 bg-white rounded-2xl shadow-sm border-l-4 border-clifarBase">
                <h2 class="text-3xl font-extrabold text-clifarDark tracking-tight">Gestión de Mascotas</h2>
                <p class="text-textSec text-base flex items-center gap-2.5 mt-2">
                    <i class="fa-solid fa-circle-plus text-clifarAccent"></i> 
                    Registra una nueva mascota en el sistema
                </p>
            </div>

            <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">                
                <div class="bg-clifarBg/70 px-6 py-4 border-b border-gray-100">
                    <h3 class="text-xl font-bold text-clifarDark flex items-center gap-2.5">
                        <i class="fa-solid fa-paw text-clifarBase"></i> Datos Generales de la Mascota
                    </h3>
                </div>

                <form id="pet-form" class="p-8 md:p-10">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        
                        <!-- NOMBRE -->
                        <div class="flex flex-col gap-2">
                            <label class="text-xs uppercase tracking-widest font-black text-textSec">Nombre</label>
                            <input type="text" name="name" placeholder="Nombre de la mascota" required
                                class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-clifarBase focus:ring-4 focus:ring-clifarBase/10 outline-none transition-all" />
                        </div>

                        <!-- FECHA DE NACIMIENTO (CAMBIADO POR EDAD) -->
                        <div class="flex flex-col gap-2">
                            <label class="text-xs uppercase tracking-widest font-black text-textSec">Fecha de Nacimiento</label>
                            <input type="date" id="birthDate" name="birthDate" required
                                class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-clifarBase focus:ring-4 focus:ring-clifarBase/10 outline-none transition-all font-medium text-textMain bg-white" />
                        </div>

                        <!-- SEXO -->
                        <div class="flex flex-col gap-2">
                            <label class="text-xs uppercase tracking-widest font-black text-textSec">Sexo</label>
                            <div class="flex gap-2">
                                <label class="flex-1 flex items-center justify-center gap-2 p-3 border rounded-xl cursor-pointer hover:bg-gray-50 font-bold text-sm">
                                    <input type="radio" name="sex" value="Macho" required class="accent-clifarBase" /> Macho
                                </label>
                                <label class="flex-1 flex items-center justify-center gap-2 p-3 border rounded-xl cursor-pointer hover:bg-gray-50 font-bold text-sm">
                                    <input type="radio" name="sex" value="Hembra" class="accent-clifarCTA" /> Hembra
                                </label>
                            </div>
                        </div>

                        <!-- ESPECIE -->
                        <div class="flex flex-col gap-2">
                            <label class="text-xs uppercase tracking-widest font-black text-textSec">Especie</label>
                            <div class="flex gap-2">
                                <label class="flex-1 flex items-center justify-center gap-2 p-3 border rounded-xl cursor-pointer hover:bg-gray-50 font-bold text-sm">
                                    <input type="radio" name="type" value="Gato" required class="accent-clifarAccent" /> Gato
                                </label>
                                <label class="flex-1 flex items-center justify-center gap-2 p-3 border rounded-xl cursor-pointer hover:bg-gray-50 font-bold text-sm">
                                    <input type="radio" name="type" value="Perro" class="accent-clifarBase" /> Perro
                                </label>
                            </div>
                        </div>

                        <!-- PESO -->
                        <div class="flex flex-col gap-2">
                            <label class="text-xs uppercase tracking-widest font-black text-textSec">Peso (KG)</label>
                            <input type="number" name="weight" step="0.1" min="0.1" placeholder="Ej: 8.5" required
                                class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-clifarBase focus:ring-4 focus:ring-clifarBase/10 outline-none transition-all" />
                        </div>

                        <!-- RAZA -->
                        <div class="flex flex-col gap-2">
                            <label class="text-xs uppercase tracking-widest font-black text-textSec">Raza</label>
                            <input type="text" name="breed" placeholder="Ej: Criolla, Poodle..." required
                                class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-clifarBase focus:ring-4 focus:ring-clifarBase/10 outline-none transition-all" />
                        </div>

                    </div>

                    <div class="mt-12 flex flex-col md:flex-row gap-4 items-center justify-end border-t pt-8">
                        <a th:href="@{/dashboard}" class="px-8 py-3 text-sm font-bold text-textSec hover:text-clifarDark transition-colors">
                            CANCELAR
                        </a>
                        <button type="submit"
                            class="w-full md:w-auto bg-clifarCTA hover:bg-clifarCTA/90 text-white font-black px-12 py-4 rounded-2xl shadow-lg hover:shadow-clifarCTA/30 transition-all flex items-center justify-center gap-2 uppercase tracking-widest">
                            <i class="fa-solid fa-save text-lg"></i> Guardar Mascota
                        </button>
                    </div>
                </form>
            </div>

            <footer class="bg-clifarDark text-gray-100 p-8 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-6 mt-12">               
                <div class="text-center md:text-left opacity-80">
                    <p class="text-xs font-black text-clifarAccent uppercase mb-1">Clínica Veterinaria</p>
                    <p class="text-sm">Urb. Puente Blanco J-9, Ica</p>
                </div>
                <div class="text-center md:text-right opacity-80">
                    <p class="text-xs font-black text-clifarAccent uppercase mb-1">Contacto</p>
                    <p class="text-sm">clifarveteirl@hotmail.com</p>
                </div>
            </footer>
        </main>
    </div>

    <script>
        // Limitar el calendario para que no deje seleccionar fechas futuras
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('birthDate').setAttribute('max', today);
        });

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        function logout() {
            document.cookie = "jwt=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC; SameSite=Lax";
            window.location.href = "/";
        }

        document.getElementById("pet-form").addEventListener("submit", async function (e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);

            Swal.fire({
                title: 'Registrando...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                const res = await fetch("/pets", {
                    method: "POST",
                    body: formData,
                    credentials: "include"
                });

                if (res.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: '¡Mascota Registrada!',
                        text: 'Se ha añadido correctamente.',
                        confirmButtonColor: '#1C8C7A',
                        borderRadius: '20px'
                    }).then(() => {
                        window.location.href = "/dashboard";
                    });
                } else {
                    throw new Error();
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Hubo un problema al guardar.',
                    confirmButtonColor: '#F26A4B'
                });
            }
        });
    </script>
<div th:replace="~{fragments/asistente :: ia-asistente(modo='privado')}"></div>
</body>
</html>
