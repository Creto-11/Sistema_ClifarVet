<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8" />
    <title>CLIFARVET | Historial de Citas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        clifarBase: '#1C8C7A',
                        clifarDark: '#0F5E52',
                        clifarAccent: '#F6B44B',
                        clifarBg: '#F2F4F3',
                        textMain: '#1F2933',
                        textSec: '#6B7280',
                    }
                }
            }
        }
    </script>

    <style>
        .table-container::-webkit-scrollbar {
            height: 8px;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-clifarBg font-sans antialiased text-textMain min-h-screen">

    <header
        class="h-16 bg-clifarDark text-white px-6 flex justify-between items-center w-full fixed top-0 z-30 shadow-md">
        <div class="flex items-center gap-4">
            <button onclick="toggleSidebar()" class="md:hidden text-white focus:outline-none p-1">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-paw text-2xl text-clifarAccent"></i>
                <h1 class="text-xl font-bold tracking-tight">CLIFARVET <span class="font-light hidden sm:inline">|
                        Puente Blanco</span></h1>
            </div>
        </div>
    </header>

    <div class="flex w-full pt-16">
        <aside id="sidebar"
            class="fixed top-16 left-0 w-64 h-[calc(100vh-64px)] bg-[#111827] text-gray-300 flex flex-col justify-between z-40
              transform md:translate-x-0 -translate-x-full transition-transform duration-300 ease-in-out shadow-2xl md:shadow-none">

            <div class="py-6 flex flex-col px-3 space-y-2">
                <p class="text-[11px] uppercase tracking-widest text-gray-500 font-extrabold px-3 mb-3">Menú Principal
                </p>

                <a th:href="@{/dashboard}" class="flex items-center gap-3 p-3 rounded-lg hover:bg-white/10 transition-all">
                    <i class="fa-solid fa-table-columns w-5 text-center text-xl"></i>
                    <span class="font-medium">Dashboard</span>
                </a>

                <a th:href="@{/book-appointment}"
                    class="sidebar-link flex items-center gap-3 p-3 rounded-lg hover:bg-white/10 hover:text-white transition-all">
                    <i class="fa-solid fa-calendar-plus w-5 text-center text-xl"></i>
                    <span class="font-medium">Agendar Cita</span>
                </a>

                <a th:href="@{/appointments}" class="flex items-center gap-3 p-3 rounded-lg text-clifarAccent bg-clifarBase/30 border-l-4 border-clifarAccent transition-all shadow-inner">
                    <i class="fa-solid fa-clock w-5 text-center text-xl"></i>
                    <span class="font-medium">Ver Citas</span>
                </a>
               
                <a th:href="@{/veterinarians}"
                    class="sidebar-link flex items-center gap-3 p-3 rounded-lg hover:bg-white/10 hover:text-white transition-all">
                    <i class="fa-solid fa-user-doctor w-5 text-center text-xl"></i>
                    <span class="font-medium">Veterinarios</span>
                </a>
            </div>

            <div class="p-4 border-t border-gray-700/50">
                <button onclick="logout()"
                    class="w-full flex items-center justify-center gap-2.5 bg-gray-700/60 text-red-400 hover:bg-red-500 hover:text-white px-4 py-3 rounded-xl transition-all duration-200">
                    <i class="fa-solid fa-power-off text-lg"></i>
                    <span class="font-semibold">Cerrar Sesión</span>
                </button>
            </div>
        </aside>

<main class="flex-1 p-6 md:p-8 ml-0 md:ml-64 transition-all duration-300">
    <div class="w-full">
                <div class="mb-8 p-6 bg-white rounded-2xl shadow-sm border-l-4 border-clifarBase">
                    <h2 class="text-3xl md:text-4xl font-extrabold text-clifarDark tracking-tight">📋 Historial de Citas
                    </h2>
                    <p class="text-textSec mt-2 font-medium">Revisa el seguimiento de las consultas de tus mascotas.</p>
                </div>
                <div
                    class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8 bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400"></i>
                        <input type="text" id="searchInput" placeholder="Buscar servicio o vet..."
                            class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-clifarBase outline-none transition-all text-sm">
                    </div>
                    <select id="filterMascota"
                        class="px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-clifarBase outline-none text-sm font-medium">
                        <option value="">🐾 Todas las Mascotas</option>
                    </select>
                    <select id="filterVeterinario"
                        class="px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-clifarBase outline-none text-sm font-medium">
                        <option value="">👨‍⚕️ Todos los Veterinarios</option>
                    </select>
                    <input type="date" id="filterFecha"
                        class="px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-clifarBase outline-none text-sm">
                </div>

                <div class="hidden md:block overflow-hidden bg-white rounded-[2rem] shadow-xl border border-gray-100">
                    <div class="table-container overflow-x-auto">
                        <table class="min-w-full text-left">
                            <thead>
                                <tr class="bg-gray-50 border-b border-gray-100">
                                    <th
                                        class="px-8 py-5 text-[11px] font-black uppercase tracking-widest text-gray-400">
                                        Fecha y hora</th>
                                    <th
                                        class="px-8 py-5 text-[11px] font-black uppercase tracking-widest text-gray-400">
                                        Mascota</th>
                                    <th
                                        class="px-8 py-5 text-[11px] font-black uppercase tracking-widest text-gray-400">
                                        Servicio</th>
                                    <th
                                        class="px-8 py-5 text-[11px] font-black uppercase tracking-widest text-gray-400">
                                        Veterinario</th>
                                    <th
                                        class="px-8 py-5 text-[11px] font-black uppercase tracking-widest text-gray-400">
                                        Estado</th>
                                    <th
                                        class="px-8 py-5 text-[11px] font-black uppercase tracking-widest text-gray-400 text-center">
                                        Acción</th>
                                </tr>
                            </thead>
                            <tbody id="appointmentTableBody" class="divide-y divide-gray-50">
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="appointmentCardsContainer" class="md:hidden space-y-4">
                </div>

            </div>
        </main>
    </div>

    <div id="reasonModal"
        class="hidden fixed inset-0 bg-clifarDark/60 backdrop-blur-sm flex items-center justify-center z-50 p-6">
        <div class="bg-white p-8 rounded-[2rem] shadow-2xl w-full max-w-sm text-center fade-in">
            <div
                class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-circle-info"></i>
            </div>
            <h2 class="text-xl font-black text-clifarDark mb-2 uppercase tracking-tight">Motivo de Cancelación</h2>
            <p id="modalReasonText" class="mb-6 text-textSec leading-relaxed"></p>
            <button onclick="closeModal()"
                class="w-full bg-clifarBase hover:bg-clifarDark text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-clifarBase/20">
                Entendido
            </button>
        </div>
    </div>

    <script>
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        const token = getCookie("jwt");

        // RENDER DE BADGES DE ESTADO
        function renderStatusBadge(status) {
            const baseClass = "px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-tighter inline-block";
            switch (status) {
                case "REGISTRADA":
                    return `<span class="${baseClass} bg-blue-100 text-blue-600">Registrada</span>`;
                case "FINALIZADA":
                    return `<span class="${baseClass} bg-green-100 text-green-600 font-bold"><i class="fa-solid fa-check mr-1"></i>Finalizada</span>`;
                case "CANCELADA":
                    return `<span class="${baseClass} bg-red-100 text-red-600">Cancelada</span>`;
                default:
                    return `<span class="${baseClass} bg-gray-100 text-gray-500">${status}</span>`;
            }
        }

        function renderMobileCards(data) {
            const container = document.getElementById("appointmentCardsContainer");
            if (!container) return;
            container.innerHTML = "";

            data.forEach(cita => {
                const card = document.createElement("div");
                card.className = "bg-white p-6 rounded-3xl shadow-sm border border-gray-100 fade-in";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">${cita.fecha} | ${cita.hora}</p>
                            <h4 class="text-lg font-black text-clifarDark">${cita.servicio}</h4>
                        </div>
                        ${renderStatusBadge(cita.estado)}
                    </div>
                    <div class="space-y-2 mb-4">
                        <p class="text-sm text-textSec"><i class="fa-solid fa-dog w-5 text-clifarAccent"></i> <b>Mascota:</b> ${cita.mascota}</p>
                        <p class="text-sm text-textSec"><i class="fa-solid fa-user-doctor w-5 text-clifarBase"></i> <b>Veterinario:</b> ${cita.veterinario}</p>
                    </div>
                    ${cita.estado === "CANCELADA" && cita.motivoCancelacion
                        ? `<button onclick="showReason('${cita.motivoCancelacion.replace(/'/g, "\\'")}')" class="w-full text-center py-2 text-xs font-bold text-clifarBase underline uppercase tracking-widest">Ver Motivo</button>`
                        : ''}
                `;
                container.appendChild(card);
            });
        }

        fetch("/api/client/appointments", { credentials: "include" })
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById("appointmentTableBody");
                const mascotaSelect = document.getElementById("filterMascota");
                const vetSelect = document.getElementById("filterVeterinario");

                tbody.innerHTML = "";
                const mascotasSet = new Set();
                const veterinariosSet = new Set();

                // Invertimos para ver las más recientes primero
                const sortedData = data.reverse();
                renderMobileCards(sortedData);

                sortedData.forEach(cita => {
                    mascotasSet.add(cita.mascota);
                    veterinariosSet.add(cita.veterinario);

                    const tr = document.createElement("tr");
                    tr.className = "hover:bg-gray-50 transition-colors";
                    tr.setAttribute("data-mascota", cita.mascota.toLowerCase());
                    tr.setAttribute("data-veterinario", cita.veterinario.toLowerCase());
                    tr.setAttribute("data-fecha", cita.fecha);

                    tr.innerHTML = `
                        <td class="px-8 py-5 text-sm font-bold text-gray-500">${cita.fecha} <span class="block text-[10px] font-normal text-gray-400">${cita.hora}</span></td>
                        <td class="px-8 py-5 text-sm font-black text-clifarDark">${cita.mascota}</td>
                        <td class="px-8 py-5 text-sm text-textSec font-medium">${cita.servicio}</td>
                        <td class="px-8 py-5 text-sm text-textSec font-medium">${cita.veterinario}</td>
                        <td class="px-8 py-5">${renderStatusBadge(cita.estado)}</td>
                        <td class="px-8 py-5 text-center">
                            ${cita.estado === "CANCELADA" && cita.motivoCancelacion
                            ? `<button onclick="showReason('${cita.motivoCancelacion.replace(/'/g, "\\'")}')" class="text-clifarBase hover:text-clifarDark transition-colors"><i class="fa-solid fa-eye mr-1"></i>Motivo</button>`
                            : `<span class="text-gray-300">-</span>`}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                // Llenar filtros
                mascotasSet.forEach(m => {
                    const opt = document.createElement("option");
                    opt.value = m; opt.textContent = m;
                    mascotaSelect.appendChild(opt);
                });
                veterinariosSet.forEach(v => {
                    const opt = document.createElement("option");
                    opt.value = v; opt.textContent = v;
                    vetSelect.appendChild(opt);
                });
            });

        // FILTROS UNIFICADOS
        function applyFilters() {
            const search = document.getElementById("searchInput").value.toLowerCase();
            const mascota = document.getElementById("filterMascota").value.toLowerCase();
            const veterinario = document.getElementById("filterVeterinario").value.toLowerCase();
            const fecha = document.getElementById("filterFecha").value;

            const rows = document.querySelectorAll("#appointmentTableBody tr");
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                const rowMascota = row.getAttribute("data-mascota");
                const rowVet = row.getAttribute("data-veterinario");
                const rowFecha = row.getAttribute("data-fecha");

                const matchesSearch = text.includes(search);
                const matchesMascota = !mascota || rowMascota === mascota;
                const matchesVet = !veterinario || rowVet === veterinario;
                const matchesFecha = !fecha || rowFecha === fecha;

                row.style.display = (matchesSearch && matchesMascota && matchesVet && matchesFecha) ? "" : "none";
            });
        }

        ["searchInput", "filterMascota", "filterVeterinario", "filterFecha"].forEach(id => {
            document.getElementById(id).addEventListener("input", applyFilters);
        });

        function showReason(reason) {
            document.getElementById("modalReasonText").innerText = reason;
            document.getElementById("reasonModal").classList.remove("hidden");
        }

        function closeModal() {
            document.getElementById("reasonModal").classList.add("hidden");
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        function logout() {
            document.cookie = "jwt=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC;";
            window.location.href = "/";
        }
    </script>
<div th:replace="~{fragments/asistente :: ia-asistente(modo='privado')}"></div>
</body>

</html>
