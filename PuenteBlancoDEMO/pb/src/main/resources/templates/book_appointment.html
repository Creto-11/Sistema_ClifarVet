<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8" />
    <title>CLIFARVET | Reservar Cita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        clifarBase: '#1C8C7A',    
                        clifarDark: '#0F5E52',    
                        clifarLight: '#6FC3B2',   
                        clifarCTA: '#F26A4B',     
                        clifarAccent: '#F6B44B',  
                        clifarBg: '#F2F4F3',      
                        textMain: '#1F2933',      
                        textSec: '#6B7280',       
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-clifarBg font-sans antialiased text-textMain min-h-screen">

    <header class="h-16 bg-clifarDark text-white px-6 flex justify-between items-center w-full fixed top-0 z-30 shadow-md">
        <div class="flex items-center gap-4">
            <button onclick="toggleSidebar()" class="md:hidden text-white focus:outline-none p-1">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-paw text-2xl text-clifarAccent"></i>
                <h1 class="text-xl font-bold tracking-tight">CLIFARVET <span class="font-light hidden sm:inline">| Puente Blanco</span></h1>
            </div>
        </div>
    </header>

    <div class="flex w-full">
        <aside id="sidebar" class="fixed top-16 left-0 w-64 h-[calc(100vh-64px)] bg-[#111827] text-gray-300 flex flex-col justify-between z-40
              transform md:translate-x-0 -translate-x-full transition-transform duration-300 ease-in-out">
            
            <div class="py-6 flex flex-col px-3 space-y-2">
                <p class="text-[11px] uppercase tracking-widest text-gray-500 font-extrabold px-3 mb-3">Menú Principal</p>
                
                <a th:href="@{/dashboard}" class="flex items-center gap-3 p-3 rounded-lg hover:bg-white/10 transition-all">
                    <i class="fa-solid fa-table-columns w-5 text-center text-xl"></i>
                    <span class="font-medium">Dashboard</span>
                </a>

                <a th:href="@{/book-appointment}" class="flex items-center gap-3 p-3 rounded-lg text-clifarAccent bg-clifarBase/30 border-l-4 border-clifarAccent transition-all shadow-inner">
                    <i class="fa-solid fa-calendar-plus w-5 text-center text-xl font-bold"></i>
                    <span class="font-bold">Agendar Cita</span>
                </a>

                <a th:href="@{/appointments}" class="flex items-center gap-3 p-3 rounded-lg hover:bg-white/10 transition-all">
                    <i class="fa-solid fa-clock w-5 text-center text-xl"></i>
                    <span class="font-medium">Ver Citas</span>
                </a>

                <a th:href="@{/veterinarians}" class="flex items-center gap-3 p-3 rounded-lg hover:bg-white/10 transition-all">
                    <i class="fa-solid fa-user-doctor w-5 text-center text-xl"></i>
                    <span class="font-medium">Veterinarios</span>
                </a>
            </div>

            <div class="p-4 border-t border-gray-700/50">
                <button onclick="logout()" class="w-full flex items-center justify-center gap-2.5 bg-gray-700/60 text-red-400 hover:bg-red-500 hover:text-white px-4 py-3 rounded-xl transition-all duration-200">
                    <i class="fa-solid fa-power-off text-lg"></i> 
                    <span class="font-semibold">Cerrar Sesión</span>
                </button>
            </div>
        </aside>

        <main class="flex-1 p-4 md:p-8 pt-24 md:ml-64">
            
            <div class="mb-8 p-6 bg-white rounded-2xl shadow-sm border-l-4 border-clifarAccent max-w-5xl mx-auto">
                <h2 class="text-3xl font-extrabold text-clifarDark tracking-tight">Nueva Reservación</h2>
                <p class="text-textSec text-base flex items-center gap-2.5 mt-2">
                    <i class="fa-solid fa-notes-medical text-clifarBase"></i> 
                    Complete los datos para agendar la atención de su mascota.
                </p>
            </div>

            <div class="bg-white rounded-2xl shadow-sm overflow-hidden max-w-5xl mx-auto border border-gray-100">
                <form id="appointmentForm" class="p-8 md:p-10">
                    
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                        
                        <div class="space-y-8">
                            <h3 class="text-lg font-bold text-clifarDark flex items-center gap-2 border-b pb-2">
                                <i class="fa-solid fa-stethoscope text-clifarBase"></i> Información Médica
                            </h3>

                            <div class="flex flex-col gap-2">
                                <label class="text-xs uppercase tracking-widest font-black text-textSec">Mascota</label>
                                <select id="pet" name="petId" required
                                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-clifarBase focus:ring-4 focus:ring-clifarBase/10 outline-none bg-white font-medium">
                                    <option disabled selected>Seleccione una mascota</option>
                                </select>
                            </div>

                            <div class="p-5 bg-clifarBg/50 rounded-2xl border border-dashed border-gray-300">
                                <label class="block text-xs uppercase tracking-widest font-black text-clifarDark mb-4">Síntomas Actuales</label>
                                <div class="grid grid-cols-2 gap-3">
                                    <label class="flex items-center gap-3 p-3 bg-white rounded-xl border cursor-pointer hover:border-clifarBase transition-all text-sm font-medium">
                                        <input type="checkbox" class="sintoma w-4 h-4 accent-clifarBase" value="vomitos"> Vómitos
                                    </label>
                                    <label class="flex items-center gap-3 p-3 bg-white rounded-xl border cursor-pointer hover:border-clifarBase transition-all text-sm font-medium">
                                        <input type="checkbox" class="sintoma w-4 h-4 accent-clifarBase" value="fiebre"> Fiebre
                                    </label>
                                    <label class="flex items-center gap-3 p-3 bg-white rounded-xl border cursor-pointer hover:border-clifarBase transition-all text-sm font-medium">
                                        <input type="checkbox" class="sintoma w-4 h-4 accent-clifarBase" value="dolor"> Dolor
                                    </label>
                                    <label class="flex items-center gap-3 p-3 bg-white rounded-xl border cursor-pointer hover:border-clifarBase transition-all text-sm font-medium">
                                        <input type="checkbox" class="sintoma w-4 h-4 accent-clifarBase" value="herida"> Herida
                                    </label>
                                    <label class="flex items-center gap-3 p-3 bg-white rounded-xl border cursor-pointer hover:border-clifarCTA transition-all text-sm font-bold text-red-600 col-span-2">
                                        <input type="checkbox" class="sintoma w-4 h-4 accent-clifarCTA" value="convulsiones"> Convulsiones / Dificultad Respiratoria
                                    </label>
                                </div>
                            </div>

                            <div class="flex flex-col gap-2">
                                <label class="text-xs uppercase tracking-widest font-black text-textSec">Prioridad Estimada</label>
                                <select id="prioridad" name="prioridad"
                                    class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-gray-50 font-bold transition-all">
                                    <option value="BAJA">🟢 Consulta Normal</option>
                                    <option value="MEDIA">🟡 Síntomas Detectados</option>
                                    <option value="ALTA">🔴 EMERGENCIA CRÍTICA</option>
                                </select>
                            </div>
                        </div>

                        <div class="space-y-8">
                            <h3 class="text-lg font-bold text-clifarDark flex items-center gap-2 border-b pb-2">
                                <i class="fa-solid fa-clock text-clifarBase"></i> Programación
                            </h3>

                            <div class="flex flex-col gap-2">
                                <label class="text-xs uppercase tracking-widest font-black text-textSec">Servicio</label>
                                <select id="servicio" name="servicioId" required
                                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-clifarBase outline-none bg-white font-medium">
                                    <option disabled selected>¿Qué servicio requiere?</option>
                                </select>
                            </div>

                            <div class="flex flex-col gap-2">
                                <label class="text-xs uppercase tracking-widest font-black text-textSec">Veterinario</label>
                                <select id="veterinario" name="veterinarioId" required
                                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-clifarBase outline-none bg-white font-medium">
                                    <option disabled selected>Seleccione especialista</option>
                                </select>
                            </div>

                            <div class="flex flex-col gap-2">
                                <label class="text-xs uppercase tracking-widest font-black text-textSec">Fecha de Cita</label>
                                <input type="date" id="fecha" name="fecha" required
                                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-clifarBase outline-none font-medium" />
                            </div>

                            <div id="horaContainer" class="hidden animate-fade-in">
                                <label class="text-xs uppercase tracking-widest font-black text-textSec mb-3 block">Horarios Disponibles</label>
                                <div id="slots" class="grid grid-cols-3 gap-2">
                                    </div>
                                <input type="hidden" id="horaSeleccionada" name="hora" required />
                            </div>
                        </div>
                    </div>

                    <div class="mt-12 flex justify-end border-t pt-8">
                        <button type="submit" id="submitBtn"
                            class="w-full md:w-auto bg-clifarCTA hover:bg-clifarCTA/90 text-white font-black px-16 py-4 rounded-2xl shadow-xl transition-all flex items-center justify-center gap-3 uppercase tracking-widest">
                            <i class="fa-solid fa-calendar-check text-xl"></i> Confirmar Reservación
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        // Mantenemos tu lógica JS pero con mejoras visuales en los feedbacks
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('fecha').setAttribute('min', today);

            // Fetch Mascotas, Servicios y Veterinarios (Tus endpoints originales)
            loadData('/api/client/pets', 'pet', (p) => `${p.name} (${p.breed})`);
            loadData('/api/client/services', 'servicio', (s) => s.nombre || s.descripcion);
            loadData('/api/client/veterinarians', 'veterinario', (v) => v.nombreCompleto);
        });

        async function loadData(url, elementId, textFn) {
            try {
                const res = await fetch(url);
                const data = await res.json();
                const select = document.getElementById(elementId);
                data.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item.id;
                    opt.textContent = textFn(item);
                    select.appendChild(opt);
                });
            } catch (e) { console.error("Error cargando " + elementId); }
        }

        // Lógica de Horarios
        document.getElementById('fecha').addEventListener('change', cargarHorarios);
        document.getElementById('veterinario').addEventListener('change', cargarHorarios);

        function cargarHorarios() {
            const vetId = document.getElementById('veterinario').value;
            const fecha = document.getElementById('fecha').value;
            if (!vetId || !fecha) return;

            fetch(`/api/client/veterinarians/${vetId}/horarios?fecha=${fecha}`)
                .then(res => res.json())
                .then(horas => {
                    const container = document.getElementById('slots');
                    container.innerHTML = '';
                    document.getElementById('horaContainer').classList.remove('hidden');

                    horas.forEach(hora => {
                        const btn = document.createElement('button');
                        btn.type = "button";
                        btn.textContent = hora;
                        btn.className = "p-3 rounded-xl border font-bold text-sm transition-all hover:bg-clifarBase hover:text-white";
                        btn.onclick = () => {
                            document.querySelectorAll('#slots button').forEach(b => b.classList.remove('bg-clifarBase', 'text-white', 'border-clifarBase'));
                            btn.classList.add('bg-clifarBase', 'text-white', 'border-clifarBase');
                            document.getElementById('horaSeleccionada').value = hora;
                        };
                        container.appendChild(btn);
                    });
                });
        }

        // Triaje Automático
        document.addEventListener("change", (e) => {
            if (e.target.classList.contains("sintoma")) {
                const sintomas = document.querySelectorAll('.sintoma:checked');
                const prioridadSelect = document.getElementById("prioridad");
                const submitBtn = document.getElementById("submitBtn");
                let nivel = "BAJA";

                sintomas.forEach(s => {
                    if (s.value === "convulsiones" || s.value === "respirar") nivel = "ALTA";
                    else if (nivel !== "ALTA") nivel = "MEDIA";
                });

                prioridadSelect.value = nivel;
                
                if (nivel === "ALTA") {
                    prioridadSelect.classList.add('border-red-500', 'text-red-600');
                    submitBtn.disabled = true;
                    submitBtn.classList.replace('bg-clifarCTA', 'bg-gray-400');
                    submitBtn.innerHTML = "🚨 EMERGENCIA: ACUDA A CLÍNICA";
                    
                    Swal.fire({
                        icon: 'warning',
                        title: '¡Alerta de Emergencia!',
                        text: 'Los síntomas indican un estado crítico. Por favor, no espere una cita y acuda inmediatamente a emergencias.',
                        confirmButtonColor: '#F26A4B'
                    });
                } else {
                    prioridadSelect.classList.remove('border-red-500', 'text-red-600');
                    submitBtn.disabled = false;
                    submitBtn.classList.replace('bg-gray-400', 'bg-clifarCTA');
                    submitBtn.innerHTML = '<i class="fa-solid fa-calendar-check text-xl"></i> Confirmar Reservación';
                }
            }
        });

        // Submit Form
        document.getElementById('appointmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;

            const data = {
                petId: document.getElementById('pet').value,
                servicioId: document.getElementById('servicio').value,
                veterinarioId: document.getElementById('veterinario').value,
                prioridad: document.getElementById('prioridad').value,
                fecha: document.getElementById('fecha').value,
                hora: document.getElementById('horaSeleccionada').value
            };

            try {
                const res = await fetch('/api/client/appointments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (!res.ok) throw new Error();

                Swal.fire({
                    icon: 'success',
                    title: '¡Cita Reservada!',
                    text: 'Te esperamos en Clifarvet.',
                    confirmButtonColor: '#1C8C7A'
                }).then(() => window.location.href = "/appointments");

            } catch (err) {
                Swal.fire({ icon: 'error', title: 'Error', text: 'No se pudo agendar la cita.' });
                submitBtn.disabled = false;
            }
        });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        function logout() {
            document.cookie = "jwt=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC;";
            window.location.href = "/";
        }
    </script>
</body>
</html>
