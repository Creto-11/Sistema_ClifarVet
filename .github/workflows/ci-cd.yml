name: CI-CD Puente Blanco Backend

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_NAME: puente_blanco
  DB_USER: root
  DB_PASSWORD: ""

  SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/puente_blanco?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: ""

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: puente_blanco
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: PuenteBlancoDEMO/pb

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('PuenteBlancoDEMO/pb/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build and run tests
        run: mvn -B clean verify -e
